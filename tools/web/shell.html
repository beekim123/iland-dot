<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴贝小岛 · Sunny Shell</title>
$GODOT_HEAD_INCLUDE
<style>html,body{margin:0;width:100%;height:100%;background:#163f4c;color:#fff7e9;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block;width:100%;height:100%;outline:none}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#163f4c;gap:18px;padding:24px}h1{font-size:36px;letter-spacing:.2em;margin:0}p{margin:0;line-height:1.7}progress{width:280px;max-width:80vw;accent-color:#a4bb8b;margin:auto}button{background:#ead3a5;color:#28212d;border:0;border-radius:24px;padding:14px 28px;font-size:18px;cursor:pointer}#error{color:#f1ad92;white-space:pre-wrap;max-width:680px}small{color:#c4b6a5}</style></head>
<body><canvas id="canvas" tabindex="0">你的浏览器需要支持 WebGL 2。</canvas><section id="loading"><h1>晴贝小岛</h1><p>转动海岛，寻找彩色魔法传送门。<br>粉色：软糖爆爆岛 · 青色：绒芽争园。</p><progress id="progress"></progress><p id="status">准备小岛……</p><button id="start" hidden>进入小岛</button><small>拖动旋转 · 滚轮缩放 · 点击粉色或青色传送门进入游戏<br>软糖：方向键移动 · 空格放炸弹<br>绒芽：点击锁定鼠标 · WASD 相对镜头移动 · 鼠标环视瞄准<br>左键喷射花蜜 · 右键花苞 · 空格冲刺<br>Esc 暂停/释放鼠标 · 点击继续恢复 · 房子图标返回</small><p id="error" role="alert"></p></section>
<script src="$GODOT_URL"></script><script>
'use strict';
const config=$GODOT_CONFIG;
const engine=new Engine(config);
const overlay=document.getElementById('loading'), status=document.getElementById('status'), progress=document.getElementById('progress'), start=document.getElementById('start');
function fail(e,hint='请使用包内 serve.py 启动，访问 http://127.0.0.1:8071/；勿直接双击 HTML。'){status.textContent='暂时无法打开小岛';document.getElementById('error').textContent=String(e?.message||e)+'\n'+hint;progress.hidden=true;}
const missing=Engine.getMissingFeatures({threads:$GODOT_THREADS_ENABLED});
if(location.protocol==='file:')fail('浏览器禁止从 file:// 加载游戏文件。');
else if(missing.length)fail('浏览器缺少支持：'+missing.join(', '),'当前浏览器或设备未提供所需的图形能力。请换用支持 WebGL 2 的桌面浏览器和设备；无需修改安全设置。');
else{
 status.textContent='点击进入，开始加载';progress.hidden=true;start.hidden=false;
 start.onclick=()=>{start.disabled=true;start.hidden=true;progress.hidden=false;status.textContent='正在展开小岛……';engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(total>0){progress.max=total;progress.value=current;status.textContent='正在展开小岛…… '+Math.floor(current/total*100)+'%';}},onExit:()=>{overlay.style.display='grid';status.textContent='小岛已合上，刷新页面可再次进入。';progress.hidden=true;}}).then(()=>{overlay.style.display='none';document.getElementById('canvas').focus();}).catch(fail);};
}
</script></body></html>
